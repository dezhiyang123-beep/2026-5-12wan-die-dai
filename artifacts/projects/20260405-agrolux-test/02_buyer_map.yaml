  pitch_sequence:
    step1: "产品方案演示→技术可行性讨论"
    step2: "样品+小规模田间试验"
    step3: "LYRA兼容性验证+OS集成协议"
    step4: "商务条款谈判"
  best_case: "Agrolux接受OEM，成为LYRA可调光谱独家供应商[L]"
  worst_case: "Agrolux拒绝OEM，方案转直接市场竞争[M]"

