# ── 市场数据 ────────────────────────────────────────────────────
market_data:
  price_distribution: |
    无公开定价体系。唯一找到的零售参考：Iluminar iLogic 6（330W）$725[H]。
    成本基准指标：HPS 1000W≈$550时约$0.26/µmol[M]。
    LED预估：$0.15-0.30/µmol（有限推断，非实测）[M]。
    B2B项目定制报价是行业惯例，价格不透明[H]。
  volume_signal: |
    温室照明CAGR 22.4%，2023年$37亿→2028年$104亿[H-marketsandmarkets.com]。
    温室场景占比43.2%（2024年）[H]。
    LED替代HPS是主要增量来源，迁移周期18-36个月回本[H]。
  trend_notes: |
    1. 效能竞争：顶级竞品已达4.1-4.3 µmol/J，行业门槛快速提升[H]
    2. 平台化：控制软件成为差异化核心（Signify GrowWise/Agrolux OS/Heliospectra helioCORE）[H]
    3. 模块化：LYRA和MITRA X均主打可升级，延长设备投资生命周期[H]
    4. DLC QPL：北美商业采购需要DLC认证，UL 8800是必要前提[H]

# ── 用户场景 ────────────────────────────────────────────────────
user_scenarios:
  - scenario: "冬季顶部补光（最主流）：大型温室番茄/黄瓜冬季自然光不足"
    behavioral_contradiction: "要满足DLI目标（番茄22-30 mol/m²/day）就要高功率持续开灯→但电费是最大运营成本"
  - scenario: "HPS升级改造：旧温室从1000W高压钠灯切换LED"
    behavioral_contradiction: "要降低能耗就必须换LED→但HPS产生的热量是温室加热的一部分，换LED后冬季反而需要额外供暖成本"
  - scenario: "多品种混栽温室：同一设施种不同番茄品种"
    behavioral_contradiction: "要优化某品种光谱配方→但同一顶灯覆盖区域内无法给不同品种分别配光"
  - scenario: "层间密植（inter-lighting）：高密度番茄/黄瓜植株顶部覆盖不足"
    behavioral_contradiction: "要提升中下层叶片光照→但顶灯穿透力有限，进入冠层会造成温度伤害（HPS尤其严重）"
  - scenario: "商业决策：种植者评估新LED供应商"
    behavioral_contradiction: "要选最优产品→但市场数据不透明（无公开价格/光谱数据缺乏可比性），只能依赖供应商自述"

