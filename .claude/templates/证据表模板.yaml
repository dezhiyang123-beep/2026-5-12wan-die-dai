# Evidence Ledger 证据表模板
# 每条数据一行，正文中的数字必须引用Claim_ID

claims:
  - claim_id: "CL-001"
    field: "字段名（如：竞品价格/市场规模/认证状态/公司名/重量/FOB...）"
    value: "具体数值或文本"
    source_url: "来源页面URL"
    page_excerpt: "页面上可见的包含该数据的原文摘录（必须能看到数字）"
    data_type: "[FACT] / [DERIVED] / [UNKNOWN]"
    verification:
      status: "VERIFIED / DERIVED / UNKNOWN / FAIL"
      second_source: "第二来源URL（高影响字段必填）"
      counter_check: "反面检验结果（高影响字段必填）：主动搜索了什么反面证据，结果是什么"
      derivation_chain: "如果是[DERIVED]，写完整推导链条和每层假设"
