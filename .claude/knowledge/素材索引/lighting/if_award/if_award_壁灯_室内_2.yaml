    visual_summary: 蛇形S曲线壁灯，灰绿色金属薄片连续弯曲形成波浪形态，从圆形壁座向下延伸四段反向弯折，每段内弧处内嵌LED点光源，极富雕塑感
    design_language:
      form: 垂直蛇形连续弯折，薄片金属形成S型多段曲线，圆形壁座固定于顶端，整体轮廓如舞动的绸带
      proportion: 总高约为宽度的5-6倍，每段弯折半径相近，形成节奏均匀的波浪韵律
