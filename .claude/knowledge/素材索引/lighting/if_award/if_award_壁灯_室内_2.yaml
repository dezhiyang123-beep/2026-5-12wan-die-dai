    visual_summary: 白色圆环形壁灯，正视图，哑光玻璃圆盘内嵌LED环形光源，一根细长黄铜棒斜穿圆盘形成对角张力，光线从环形槽中均匀溢出，整体极简优雅
    design_language:
      form: 正圆形平板灯体，大直径低厚度，圆环光源居中，黄铜细杆斜向贯穿形成构成感
      proportion: 圆盘直径与厚度比约15:1，黄铜杆略超出圆盘直径，视觉重心居中偏上
      material: 哑光白色玻璃/亚克力圆盘，拉丝黄铜细杆，LED环形光源内嵌
      color: 纯白+暖金，双色对比克制而高级
      light_output: 环形间接光，光线从圆盘边缘槽口溢出，形成柔和晕圈，无直射刺眼光
      detail: 黄铜杆与圆盘交叉点无额外连接件，极简穿插；圆盘边缘有细腻倒角；斜杆角度约45度
